<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CodeBlock</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  html, body { margin: 0; background: var(--surface); color: var(--ink); }

</style>

<body>
<div id="root" class="el-page" style="padding:24px"></div>
<script>
var E = window.EvinLe, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h(E.CodeBlock, {highlight:[5], emphasis:['combineLatest'], code:'const rows$ = src$.pipe(map(toRows));\nconst totals$ = src$.pipe(map(toTotals));\n\n// both derive from src$, so every src$ event emits twice here\nconst view$ = combineLatest([rows$, totals$]).pipe(\n  map(([rows, totals]) => render(rows, totals)),\n);'}));
</script>
